name = "email-worker"
main = "src/index.ts"
compatibility_date = "2024-03-18"

[observability]
enabled = true

[vars]
API_BASE_URL = "https://teammindai.com"
# Do not store the actual API key here - use secrets instead

[env.development]
vars = { API_BASE_URL = "http://localhost:3000" }
# To set the API key as a secret, use:
# wrangler secret put API_KEY
