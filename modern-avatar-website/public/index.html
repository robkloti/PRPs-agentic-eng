<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Modern Avatar Website - Dual provider support with HeyGen and D-ID for interactive AI avatars" />
  <meta name="keywords" content="avatar, AI, HeyGen, D-ID, interactive, video streaming, modern UI" />
  <meta name="author" content="Modern Avatar Website" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Modern Avatar Website" />
  <meta property="og:description" content="Experience next-generation AI avatars with dual provider support" />
  <meta property="og:url" content="/" />
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:title" content="Modern Avatar Website" />
  <meta property="twitter:description" content="Experience next-generation AI avatars with dual provider support" />
  
  <!-- Favicon and Apple Touch Icon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  
  <!-- Preconnect to external domains -->
  <link rel="preconnect" href="https://api.heygen.com" />
  <link rel="preconnect" href="https://agent.d-id.com" />
  <link rel="dns-prefetch" href="https://stun.l.google.com" />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <!-- Theme and PWA -->
  <meta name="theme-color" content="#667eea" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  
  <!-- Performance hints -->
  <link rel="prefetch" href="https://agent.d-id.com/v2/index.js" />
  
  <title>Modern Avatar Website</title>
  
  <style>
    /* Critical CSS for loading state */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      color: white;
      overflow-x: hidden;
    }
    
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    #root {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .loading-container {
      text-align: center;
      padding: 2rem;
    }
    
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      font-size: 1.125rem;
      font-weight: 500;
      opacity: 0.9;
    }
    
    /* Hide loading once React app loads */
    #root:not(:empty) .loading-container {
      display: none;
    }
  </style>
</head>
<body>
  <div id="root">
    <!-- Loading state shown until React app loads -->
    <div class="loading-container">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading Avatar Interface...</div>
    </div>
  </div>
  
  <!-- Modern Avatar Interface -->
  <div id="test-ui" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255,255,255,0.15); padding: 3rem; border-radius: 20px; color: white; text-align: center; backdrop-filter: blur(10px); max-width: 400px; z-index: 10000; border: 1px solid rgba(255,255,255,0.2); transition: opacity 0.5s ease, transform 0.5s ease;">
    <h1 style="margin-bottom: 1.5rem; font-size: 2.5rem; background: linear-gradient(45deg, #fff, #f0f0f0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
      🤖 Avatar Interface
    </h1>
    <p style="margin-bottom: 2rem; opacity: 0.9; font-size: 1.1rem;">Ready to connect with your AI assistant</p>
    
    <button onclick="loadAvatar()" 
            style="padding: 1.5rem 3rem; background: linear-gradient(45deg, rgba(100,150,255,0.4), rgba(150,100,255,0.4)); color: white; border: 2px solid rgba(255,255,255,0.3); border-radius: 15px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; font-size: 1.1rem; width: 100%;"
            onmouseover="this.style.background='linear-gradient(45deg, rgba(100,150,255,0.6), rgba(150,100,255,0.6))'; this.style.transform='translateY(-2px)'"
            onmouseout="this.style.background='linear-gradient(45deg, rgba(100,150,255,0.4), rgba(150,100,255,0.4))'; this.style.transform='translateY(0)'">
      ✨ Load Avatar
    </button>
    
    <div id="avatar-status" style="margin-top: 1.5rem; font-size: 0.95rem; opacity: 0.8; padding: 1rem; background: rgba(0,0,0,0.2); border-radius: 10px; display: none;"></div>
  </div>
  
  <script>
    function loadAvatar() {
      const statusDiv = document.getElementById('avatar-status');
      const uiCard = document.getElementById('test-ui');
      
      statusDiv.style.display = 'block';
      statusDiv.textContent = 'Loading avatar...';
      
      // Remove any existing script
      const existing = document.querySelector('script[src*="agent.d-id.com"]');
      if (existing) existing.remove();
      
      // Create a dedicated container for the D-ID agent
      let avatarContainer = document.getElementById('avatar-container');
      if (!avatarContainer) {
        avatarContainer = document.createElement('div');
        avatarContainer.id = 'avatar-container';
        avatarContainer.style.cssText = `
          position: fixed;
          top: 20px;
          right: 20px;
          width: 300px;
          height: 400px;
          background: rgba(0,0,0,0.1);
          border: 2px dashed rgba(255,255,255,0.3);
          border-radius: 12px;
          display: flex;
          align-items: center;
          justify-content: center;
          color: white;
          font-size: 14px;
          z-index: 1000;
        `;
        avatarContainer.innerHTML = '<div>Avatar will appear here</div>';
        document.body.appendChild(avatarContainer);
      }
      
      // Create the D-ID script with your exact configuration
      const script = document.createElement('script');
      script.type = 'module';
      script.src = 'https://agent.d-id.com/v2/index.js';
      script.setAttribute('data-mode', 'fabio');
      script.setAttribute('data-client-key', 'YXV0aDB8NjhiOTU5NmFkNGVkYWRmZDkzMDQ0YzhkOi1ObXhlQnpEWHNaaU56OTdnMUFHZQ==');
      script.setAttribute('data-base-url', 'https://api.d-id.com');
      script.setAttribute('data-agent-id', 'v2_agt_G7epb5HP');
      script.setAttribute('data-name', 'did-agent');
      script.setAttribute('data-monitor', 'true');
      script.setAttribute('data-orientation', 'horizontal');
      script.setAttribute('data-position', 'right');
      
      script.onload = function() {
        statusDiv.textContent = 'Avatar script loaded! Initializing...';
        
        // Check if avatar is initialized
        setTimeout(() => {
          const avatarElements = document.querySelectorAll('[data-name="did-agent"], iframe[src*="d-id"], div[class*="did"], div[id*="did"]');
          console.log('Found avatar elements:', avatarElements);
          
          if (avatarElements.length > 0) {
            statusDiv.textContent = 'Avatar found! Loading interface...';
            
            // Move any avatar elements to our container and hide UI card
            avatarElements.forEach(el => {
              if (el.tagName === 'IFRAME' || el.offsetWidth > 0) {
                avatarContainer.innerHTML = '';
                avatarContainer.appendChild(el);
                
                // Hide the UI card with smooth animation
                setTimeout(() => {
                  uiCard.style.opacity = '0';
                  uiCard.style.transform = 'translate(-50%, -50%) scale(0.9)';
                  
                  setTimeout(() => {
                    uiCard.style.display = 'none';
                  }, 500);
                }, 1000);
              }
            });
          } else {
            // Avatar might still be loading, wait a bit longer
            setTimeout(() => {
              const laterElements = document.querySelectorAll('[data-name="did-agent"], iframe, div[class*="agent"]');
              if (laterElements.length > 0) {
                console.log('Avatar loaded after delay');
                // Hide UI card even if we can't find specific elements
                setTimeout(() => {
                  uiCard.style.opacity = '0';
                  uiCard.style.transform = 'translate(-50%, -50%) scale(0.9)';
                  setTimeout(() => uiCard.style.display = 'none', 500);
                }, 1000);
              } else {
                statusDiv.textContent = 'Avatar script loaded. Avatar should appear soon...';
                // Hide UI after a delay regardless, since the avatar might be working
                setTimeout(() => {
                  uiCard.style.opacity = '0';
                  uiCard.style.transform = 'translate(-50%, -50%) scale(0.9)';
                  setTimeout(() => uiCard.style.display = 'none', 500);
                }, 3000);
              }
            }, 5000);
          }
        }, 3000);
      };
      
      script.onerror = function(e) {
        statusDiv.textContent = 'Error loading avatar. Please try again.';
        console.error('Avatar script error:', e);
      };
      
      document.body.appendChild(script);
      console.log('Avatar script added with configuration');
      console.log('Script attributes:', script.getAttributeNames().map(name => `${name}="${script.getAttribute(name)}"`));
    }
    
    // Hide test UI once React loads (if it ever does)
    setTimeout(function() {
      const root = document.getElementById('root');
      if (root && root.children.length > 1) {
        document.getElementById('test-ui').style.display = 'none';
      }
    }, 3000);
  </script>

  <!-- Module script will be injected by Vite -->
  <script type="module" src="/src/main.tsx"></script>
  
  <!-- Performance monitoring -->
  <script>
    // Mark page load start
    if ('performance' in window) {
      window.performance.mark('page-start');
    }
    
    // Basic error handling
    window.addEventListener('error', function(e) {
      console.error('Global error:', e.error);
    });
    
    window.addEventListener('unhandledrejection', function(e) {
      console.error('Unhandled promise rejection:', e.reason);
    });
  </script>
  
  <!-- Service Worker Registration (for future PWA features) -->
  <script>
    if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js')
          .then(function(registration) {
            console.log('SW registered: ', registration);
          })
          .catch(function(registrationError) {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }
  </script>
</body>
</html>
