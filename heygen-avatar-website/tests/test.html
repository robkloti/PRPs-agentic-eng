<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyGen Avatar Website - Test Suite</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a2e;
            color: #ffffff;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        h1, h2 {
            color: #4f46e5;
            border-bottom: 2px solid #4f46e5;
            padding-bottom: 10px;
        }
        
        .test-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .test-button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        
        .test-button:hover {
            background: #3730a3;
        }
        
        .test-button:disabled {
            background: #64748b;
            cursor: not-allowed;
        }
        
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
        
        .test-pass {
            background: rgba(16, 185, 129, 0.2);
            border-left: 4px solid #10b981;
            color: #10b981;
        }
        
        .test-fail {
            background: rgba(239, 68, 68, 0.2);
            border-left: 4px solid #ef4444;
            color: #ef4444;
        }
        
        .test-info {
            background: rgba(79, 70, 229, 0.2);
            border-left: 4px solid #4f46e5;
            color: #4f46e5;
        }
        
        .test-warn {
            background: rgba(245, 158, 11, 0.2);
            border-left: 4px solid #f59e0b;
            color: #f59e0b;
        }
        
        #test-log {
            background: #000;
            color: #0f0;
            padding: 15px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-top: 20px;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        
        .stat {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            flex: 1;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.8;
        }
        
        .config-panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .config-item {
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .config-item label {
            min-width: 150px;
            font-size: 14px;
        }
        
        .config-item input, .config-item select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: white;
            padding: 5px 10px;
            flex: 1;
        }
        
        .browser-info {
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HeyGen Avatar Website - Test Suite</h1>
        
        <div class="browser-info">
            <h3>Browser Information</h3>
            <div id="browser-info"></div>
        </div>
        
        <div class="config-panel">
            <h3>Test Configuration</h3>
            <div class="config-item">
                <label for="test-webhook-url">N8N Webhook URL:</label>
                <input type="url" id="test-webhook-url" placeholder="https://your-n8n-instance.com/webhook/...">
            </div>
            <div class="config-item">
                <label for="test-idle-video">Idle Video URL:</label>
                <input type="url" id="test-idle-video" placeholder="https://your-cdn.com/idle-avatar.mp4">
            </div>
            <div class="config-item">
                <label for="test-mode">Test Mode:</label>
                <select id="test-mode">
                    <option value="quick">Quick Tests</option>
                    <option value="full">Full Test Suite</option>
                    <option value="integration">Integration Tests</option>
                </select>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="tests-passed">0</div>
                <div class="stat-label">Tests Passed</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="tests-failed">0</div>
                <div class="stat-label">Tests Failed</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="tests-total">0</div>
                <div class="stat-label">Total Tests</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="test-duration">0s</div>
                <div class="stat-label">Duration</div>
            </div>
        </div>
        
        <div class="test-section">
            <h2>Browser Compatibility Tests</h2>
            <button class="test-button" onclick="runBrowserTests()">Run Browser Tests</button>
            <button class="test-button" onclick="testMediaRecorder()">Test Media Recorder</button>
            <button class="test-button" onclick="testVideoElement()">Test Video Element</button>
            <div id="browser-test-results"></div>
        </div>
        
        <div class="test-section">
            <h2>Component Tests</h2>
            <button class="test-button" onclick="testConfigValidation()">Test Configuration</button>
            <button class="test-button" onclick="testUtils()">Test Utilities</button>
            <button class="test-button" onclick="testCostTracker()">Test Cost Tracker</button>
            <button class="test-button" onclick="testAudioRecorder()">Test Audio Recorder</button>
            <div id="component-test-results"></div>
        </div>
        
        <div class="test-section">
            <h2>Integration Tests</h2>
            <button class="test-button" onclick="testVideoManager()">Test Video Manager</button>
            <button class="test-button" onclick="testWebhookClient()">Test Webhook Client</button>
            <button class="test-button" onclick="testUIController()">Test UI Controller</button>
            <div id="integration-test-results"></div>
        </div>
        
        <div class="test-section">
            <h2>Manual Tests</h2>
            <button class="test-button" onclick="testMicrophonePermission()">Test Microphone Permission</button>
            <button class="test-button" onclick="testRecordingFlow()">Test Recording Flow</button>
            <button class="test-button" onclick="testVideoTransition()">Test Video Transition</button>
            <button class="test-button" onclick="loadMainApp()" id="load-main-app">Load Main Application</button>
            <div id="manual-test-results"></div>
        </div>
        
        <div class="test-section">
            <h2>Performance Tests</h2>
            <button class="test-button" onclick="testPerformance()">Run Performance Tests</button>
            <button class="test-button" onclick="testMemoryUsage()">Test Memory Usage</button>
            <div id="performance-test-results"></div>
        </div>
        
        <div class="test-section">
            <h2>Run All Tests</h2>
            <button class="test-button" onclick="runAllTests()" style="background: #10b981; font-size: 16px; padding: 15px 30px;">
                🚀 Run All Tests
            </button>
            <button class="test-button" onclick="clearResults()">Clear Results</button>
        </div>
        
        <div id="test-log"></div>
    </div>

    <!-- Load application dependencies for testing -->
    <script src="../config/config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/cost-tracker.js"></script>
    <script src="../js/audio-recorder.js"></script>
    <script src="../js/video-manager.js"></script>
    <script src="../js/webhook-client.js"></script>
    <script src="../js/ui-controller.js"></script>
    
    <!-- Test framework -->
    <script src="test-framework.js"></script>
    <script src="browser-tests.js"></script>
    <script src="component-tests.js"></script>
    <script src="integration-tests.js"></script>
    <script src="manual-tests.js"></script>
    <script src="performance-tests.js"></script>
    
    <script>
        // Initialize test environment
        window.addEventListener('load', () => {
            initializeTestEnvironment();
            displayBrowserInfo();
        });
        
        function initializeTestEnvironment() {
            log('Test environment initialized');
            
            // Override console methods to capture logs
            const originalLog = console.log;
            const originalWarn = console.warn;
            const originalError = console.error;
            
            console.log = (...args) => {
                log('[LOG] ' + args.join(' '));
                originalLog.apply(console, args);
            };
            
            console.warn = (...args) => {
                log('[WARN] ' + args.join(' '));
                originalWarn.apply(console, args);
            };
            
            console.error = (...args) => {
                log('[ERROR] ' + args.join(' '));
                originalError.apply(console, args);
            };
        }
        
        function displayBrowserInfo() {
            const info = document.getElementById('browser-info');
            const browserSupport = Utils.checkBrowserSupport();
            
            info.innerHTML = `
                <strong>Browser:</strong> ${Utils.getBrowserName()}<br>
                <strong>User Agent:</strong> ${navigator.userAgent}<br>
                <strong>Mobile:</strong> ${Utils.isMobileDevice()}<br>
                <strong>iOS:</strong> ${Utils.isIOS()}<br>
                <strong>Android:</strong> ${Utils.isAndroid()}<br>
                <strong>Viewport:</strong> ${window.innerWidth}x${window.innerHeight}<br>
                <strong>Supported:</strong> ${browserSupport.isSupported ? '✅' : '❌'}<br>
                ${!browserSupport.isSupported ? `<strong>Missing:</strong> ${browserSupport.missingFeatures.join(', ')}<br>` : ''}
            `;
        }
        
        function log(message) {
            const logElement = document.getElementById('test-log');
            const timestamp = new Date().toLocaleTimeString();
            logElement.textContent += `[${timestamp}] ${message}\n`;
            logElement.scrollTop = logElement.scrollHeight;
        }
        
        function clearResults() {
            const resultContainers = [
                'browser-test-results',
                'component-test-results', 
                'integration-test-results',
                'manual-test-results',
                'performance-test-results'
            ];
            
            resultContainers.forEach(id => {
                const element = document.getElementById(id);
                if (element) element.innerHTML = '';
            });
            
            document.getElementById('test-log').textContent = '';
            updateStats(0, 0, 0, 0);
        }
        
        function updateStats(passed, failed, total, duration) {
            document.getElementById('tests-passed').textContent = passed;
            document.getElementById('tests-failed').textContent = failed;
            document.getElementById('tests-total').textContent = total;
            document.getElementById('test-duration').textContent = duration + 's';
        }
        
        async function runAllTests() {
            const startTime = Date.now();
            let totalPassed = 0, totalFailed = 0, totalTests = 0;
            
            log('🚀 Starting comprehensive test suite...');
            
            // Run all test suites
            const testSuites = [
                { name: 'Browser Tests', fn: runBrowserTests },
                { name: 'Component Tests', fn: runComponentTests },
                { name: 'Integration Tests', fn: runIntegrationTests },
                { name: 'Performance Tests', fn: runPerformanceTests }
            ];
            
            for (const suite of testSuites) {
                log(`\n📋 Running ${suite.name}...`);
                try {
                    const results = await suite.fn();
                    if (results) {
                        totalPassed += results.passed;
                        totalFailed += results.failed;
                        totalTests += results.total;
                    }
                } catch (error) {
                    log(`❌ ${suite.name} failed: ${error.message}`);
                    totalFailed++;
                    totalTests++;
                }
            }
            
            const duration = Math.round((Date.now() - startTime) / 1000);
            updateStats(totalPassed, totalFailed, totalTests, duration);
            
            log(`\n🏁 Test suite completed in ${duration}s`);
            log(`✅ ${totalPassed} passed, ❌ ${totalFailed} failed, 📊 ${totalTests} total`);
            
            if (totalFailed === 0) {
                log('🎉 All tests passed!');
            } else {
                log('⚠️ Some tests failed. Check results above.');
            }
        }
        
        function loadMainApp() {
            const button = document.getElementById('load-main-app');
            button.disabled = true;
            button.textContent = 'Loading...';
            
            // Create iframe to load main app
            const iframe = document.createElement('iframe');
            iframe.src = '../index.html';
            iframe.style.width = '100%';
            iframe.style.height = '600px';
            iframe.style.border = '1px solid rgba(255,255,255,0.2)';
            iframe.style.borderRadius = '8px';
            iframe.style.marginTop = '20px';
            
            const manualResults = document.getElementById('manual-test-results');
            
            // Clear existing iframe
            const existingIframe = manualResults.querySelector('iframe');
            if (existingIframe) {
                existingIframe.remove();
            }
            
            manualResults.appendChild(iframe);
            
            iframe.onload = () => {
                button.disabled = false;
                button.textContent = 'Reload Main Application';
                log('✅ Main application loaded in iframe');
            };
            
            iframe.onerror = () => {
                button.disabled = false;
                button.textContent = 'Load Main Application';
                log('❌ Failed to load main application');
            };
        }
    </script>
</body>
</html>
