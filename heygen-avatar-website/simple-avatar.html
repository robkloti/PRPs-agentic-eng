<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My HeyGen Avatar</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            color: white;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            padding: 2rem;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        p {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }

        .avatar-note {
            background: rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 12px;
            margin-top: 2rem;
            backdrop-filter: blur(10px);
        }

        /* Hide the heygen embed initially, let it show when ready */
        #heygen-streaming-embed {
            /* Embed styles will be added by the script */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>My HeyGen Avatar</h1>
        <p>Your interactive avatar will appear in the bottom-left corner</p>
        <div class="avatar-note">
            <h3>How to use:</h3>
            <p>• Click the circular avatar in the bottom-left corner<br>
            • Speak directly to your avatar using voice chat<br>
            • Your custom avatar will respond in real-time</p>
        </div>
    </div>
